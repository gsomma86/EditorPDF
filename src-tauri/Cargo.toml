[package]
name = "editorpdf"
version = "1.0.19"
description = "Editor de PDF que corre en tu computadora"
authors = ["German Ezequiel Somma <sommagerman@gmail.com>"]
license = "AGPL-3.0"
repository = "https://github.com/gsomma86/EditorPDF"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "editorpdf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
# Solo para los tiempos de la pantalla de bienvenida. Tauri ya usa tokio por dentro, asi que
# no suma peso: se declara para poder llamar a sleep desde nuestro codigo.
tokio = { version = "1", features = ["time"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
