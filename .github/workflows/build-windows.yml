name: Build Windows installers

# Compila los dos instaladores de escritorio (NSIS y MSI) y los deja como artefacto descargable.
# Es la base para firmarlos más adelante con SignPath Foundation: ese paso pide un instalador ya
# compilado por un pipeline auditable, así que primero tiene que existir este.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - run: npx tsc --noEmit

      - run: npm run escritorio-build

      - uses: actions/upload-artifact@v4
        with:
          name: instaladores-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          retention-days: 14
